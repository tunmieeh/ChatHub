<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>General group | ChatHub</title>
  <link rel="stylesheet" href="app.css">
  <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-database-compat.js"></script>
</head>
<body>
  <div id="err" style="display:none;background:#e5484d;color:#fff;padding:10px 20px;font:14px sans-serif;position:fixed;top:0;left:0;right:0;z-index:99"></div>
  <div class="toast" id="toast"></div>

  <!-- Delete confirmation box -->
  <div class="overlay" id="overlay">
    <div class="dialog">
      <h4>Delete message?</h4>
      <p>Delete for everyone in the chat.</p>
      <div class="actions">
        <button type="button" class="cancel" id="cancelDelete">Cancel</button>
        <button type="button" class="confirm" id="confirmDelete">Delete</button>
      </div>
    </div>
  </div>

  <div class="dashboard">

    <nav class="navbar">
      <span class="logo">ChatHub</span>
      <div class="nav-right">
        <span class="welcome">Welcome, <strong id="userName">...</strong></span>
        <button class="btn btn-danger" id="logout" type="button">Log out</button>
      </div>
    </nav>

    <section class="chat-container">
      <div class="chat-header">
        <h3>General group</h3>
        <p>Everyone can see messages sent here</p>
      </div>

      <div class="chat-messages" id="messages"></div>

      <form class="chat-form" id="chatForm">
        <input id="text" type="text" placeholder="Type a message" autocomplete="off" required>
        <button class="btn" type="submit">Send</button>
      </form>
    </section>

  </div>

  <script>
    
    function showErr(msg) {
      const e = document.getElementById('err');
      e.style.display = 'block';
      e.textContent = 'Error: ' + msg;
    }
    window.addEventListener('error', (ev) => showErr(ev.message));
    window.addEventListener('unhandledrejection', (ev) => showErr(ev.reason && ev.reason.message ? ev.reason.message : ev.reason));
  </script>

  <script src="firebase-config.js"></script>
  <script>
    let me = null;
    let listening = false;
    let deleteKey = null;
    const nodes = {};   
    const cache = {};  
    const isTouch = window.matchMedia('(hover: none)').matches;

    // Small SVG icons
    const PEN = '<svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>';
    const BIN = '<svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>';

  
    function firstName(user) {
      const full = user.displayName || user.email.split('@')[0];
      const first = full.split(' ')[0];
      return first.charAt(0).toUpperCase() + first.slice(1).toLowerCase();
    }

    function showToast(text) {
      const t = $('toast');
      t.textContent = text;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 4000);
    }

    // Welcome the user once per login
    function greet() {
      if (sessionStorage.getItem('greeted')) return;
      sessionStorage.setItem('greeted', '1');
      const name = firstName(me);

      if (sessionStorage.getItem('newUser')) {
        sessionStorage.removeItem('newUser');
        showToast('Welcome to ChatHub, ' + name + '! 🎉');
        db.ref('messages').push({
          system: true,
          text: name + ' joined the group 👋',
          time: firebase.database.ServerValue.TIMESTAMP
        });
      } else {
        showToast('Welcome back, ' + name + '! 👋');
      }
    }

    
    auth.onAuthStateChanged((user) => {
      if (!user) {
        location.href = 'login.html';
        return;
      }
      me = user;
      $('userName').textContent = firstName(user);
      if (!listening) {
        listening = true;
        listen();
        greet();
      }
    });

    
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.message.mine')) {
        document.querySelectorAll('.message.mine.show').forEach((el) => el.classList.remove('show'));
      }
    });

    
    function iconBtn(svg, label, onClick) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'icon-btn';
      b.title = label;
      b.setAttribute('aria-label', label);
      b.innerHTML = svg;
      b.addEventListener('click', (e) => {
        e.stopPropagation();
        onClick();
      });
      return b;
    }

    
    function build(key, m) {
      const div = document.createElement('div');

      if (m.system) {
        div.className = 'system';
        div.textContent = m.text;
        return div;
      }

      const mine = m.uid === me.uid;
      div.className = 'message' + (mine ? ' mine' : '');

      const sender = document.createElement('div');
      sender.className = 'sender';
      sender.textContent = m.name;

      const text = document.createElement('div');
      text.className = 'txt';
      text.textContent = m.text;

      const meta = document.createElement('div');
      meta.className = 'meta';

      if (m.edited) {
        const edited = document.createElement('span');
        edited.className = 'edited';
        edited.textContent = 'edited';
        meta.appendChild(edited);
      }

      
      if (mine) {
        meta.appendChild(iconBtn(PEN, 'Edit', () => startEdit(key)));
        meta.appendChild(iconBtn(BIN, 'Delete', () => askDelete(key)));

        
        div.addEventListener('click', () => {
          if (isTouch) div.classList.toggle('show');
        });
      }

      const time = document.createElement('span');
      time.className = 'time';
      time.textContent = m.time
        ? new Date(m.time).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        : '';
      meta.appendChild(time);

      div.append(sender, text, meta);
      return div;
    }

    // ===== Edit =====
    function startEdit(key) {
      const div = nodes[key];
      const txt = div.querySelector('.txt');
      if (!txt) return;

      const input = document.createElement('input');
      input.className = 'edit-input';
      input.value = cache[key].text;
      input.title = 'Enter to save, Esc to cancel';
      txt.replaceWith(input);
      input.focus();

      function cancel() {
        const el = build(key, cache[key]);
        div.replaceWith(el);
        nodes[key] = el;
      }

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          cancel();
        }
        if (e.key === 'Enter') {
          const v = input.value.trim();
          if (!v || v === cache[key].text) {
            cancel();
            return;
          }
          db.ref('messages/' + key).update({ text: v, edited: true })
            .catch((err) => showErr(err.message));
        }
      });
    }

    
    function askDelete(key) {
      deleteKey = key;
      $('overlay').classList.add('open');
    }

    function closeDelete() {
      deleteKey = null;
      $('overlay').classList.remove('open');
    }

    $('cancelDelete').addEventListener('click', closeDelete);

    $('confirmDelete').addEventListener('click', () => {
      if (deleteKey) {
        db.ref('messages/' + deleteKey).remove()
          .catch((err) => showErr(err.message));
      }
      closeDelete();
    });

    
    $('overlay').addEventListener('click', (e) => {
      if (e.target === $('overlay')) closeDelete();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeDelete();
    });

    
    function listen() {
      const box = $('messages');
      const ref = db.ref('messages').limitToLast(100);

      ref.on('child_added', (snap) => {
        cache[snap.key] = snap.val();
        const el = build(snap.key, snap.val());
        nodes[snap.key] = el;
        box.appendChild(el);
        box.scrollTop = box.scrollHeight;
      }, (err) => showErr(err.message));

      ref.on('child_changed', (snap) => {
        cache[snap.key] = snap.val();
        const el = build(snap.key, snap.val());
        nodes[snap.key].replaceWith(el);
        nodes[snap.key] = el;
      });

      ref.on('child_removed', (snap) => {
        if (nodes[snap.key]) nodes[snap.key].remove();
        delete nodes[snap.key];
        delete cache[snap.key];
      });
    }

    // ===== Send a message =====
    $('chatForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const text = $('text').value.trim();
      if (!text) return;

      db.ref('messages').push({
        uid: me.uid,
        name: me.displayName || me.email,
        text: text,
        time: firebase.database.ServerValue.TIMESTAMP
      }).catch((err) => showErr(err.message));

      $('text').value = '';
    });

    // ===== Log out =====
    $('logout').addEventListener('click', () => {
      sessionStorage.removeItem('greeted');
      auth.signOut().then(() => {
        location.href = 'login.html';
      });
    });
  </script>
</body>
</html>
